<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Catálogo de Filmes</h1>
        <p>Cadastre seus filmes favoritos preenchendo o formulário abaixo.</p>
        
        <!-- O formulário é apenas visual nesta etapa -->
        <form action="#" method="get">
            <label for="titulo">Título do Filme:</label>
            <input type="text" id="titulo" name="titulo" placeholder="Ex: Matrix" required>

            <label for="ano">Ano de Lançamento:</label>
            <input type="number" id="ano" name="ano" placeholder="Ex: 1999" required>

            <button type="submit">Cadastrar Filme</button>
        </form>
    </div>
</body>
</html>
